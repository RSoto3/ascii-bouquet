<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramo de lirios ASCII</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%90%3C/text%3E%3C/svg%3E">
<script>
// Replaced at build time with the values from .env (see build.mjs).
// The defaults below are placeholders so the template also runs on its own.
window.APP_CONFIG = /*CONFIG_START*/{
  "nameA": "Ana",
  "nameB": "Beto",
  "startDate": "2025-01-01",
  "birthdayName": "Ana",
  "birthdayDate": "2000-01-01",
  "msgMonthiversary": "feliz cumple mes 💐",
  "msgAnniversaryFirst": "feliz aniversario 💐",
  "msgAnniversary": "feliz {n} años 💐",
  "msgBirthday": "¡felices {age}, {name}! 🎂",
  "enableTest": false,
  "seed": "ascii-bouquet"
}/*CONFIG_END*/;
// "YYYY-MM-DD" -> local-time Date at 00:00
window.parseYMD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1, 0, 0, 0); };
</script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  #fx { position: fixed; inset: 0; pointer-events: none; cursor: default; }
  .ui {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
    font: 12px ui-monospace, Menlo, Consolas, monospace; color: #bbb;
    background: rgba(12,12,14,.78); padding: 8px 12px; border-radius: 10px;
    border: 1px solid #2a2a30; backdrop-filter: blur(6px); max-width: 94vw;
  }
  .ui button {
    background: #222228; color: #ddd; border: 1px solid #34343c; border-radius: 6px;
    padding: 5px 9px; font: inherit; cursor: pointer;
  }
  .ui button.on { background: #e8e8ee; color: #111; border-color: #e8e8ee; }
  .ui input[type=range] { width: 90px; accent-color: #ddd; }
  .ui .sep { width: 1px; height: 18px; background: #333; }
  #juntos {
    position: fixed; left: 14px; bottom: 14px; z-index: 2; pointer-events: none;
    font: 12px ui-monospace, Menlo, Consolas, monospace; color: #ddd; line-height: 1.5;
    background: rgba(12,12,14,.78); padding: 8px 12px; border-radius: 10px;
    border: 1px solid #2a2a30; backdrop-filter: blur(6px);
  }
  #juntos .lbl { color: #eee; font-size: 13px; font-weight: bold; letter-spacing: 1px; }
  #juntos .heart { color: #f2a6c4; }
  #juntos .msg { display: none; margin-top: 2px; }
  #juntos.fiesta { border-color: #f2a6c4; box-shadow: 0 0 14px rgba(242,166,196,.35); }
  #juntos.fiesta .lbl, #juntos.fiesta .t { color: #f7c1d6; }
  #juntos.fiesta .msg { display: block; color: #ffd6e6; font-weight: bold; animation: latido 1.6s ease-in-out infinite; }
  #juntos.cumple { border-color: #ffd36e; box-shadow: 0 0 16px rgba(255,211,110,.4); }
  #juntos.cumple .lbl, #juntos.cumple .t { color: #ffe9b0; }
  #juntos.cumple .heart { color: #ff5d8f; }
  #juntos.cumple .msg {
    display: block; font-weight: bold; font-size: 13px;
    background: linear-gradient(90deg, #ff5d8f, #ffd36e, #7dff9b, #6ee7ff, #9d7bff, #ff5d8f);
    background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: arcoiris 3s linear infinite;
  }
  @keyframes arcoiris { to { background-position: 200% 0; } }
  @keyframes latido { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
  #juntos .t { font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 760px) { #juntos { bottom: auto; top: 14px; } }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #ccc;
         font: 14px ui-monospace, monospace; text-align: center; padding: 20px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<div id="err">Tu navegador no soporta WebGL2, que esta animación necesita.</div>
<div class="ui">
  <label>Detalle <input id="cell" type="range" min="4" max="14" step="1" value="5"></label>
  <button id="edges" class="on">Bordes</button>
  <button id="spin" class="on">Rotar</button>
  <button id="replay">Volver a florecer</button>
</div>
<script>
(() => {
'use strict';
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false });
if (!gl) { document.getElementById('err').style.display = 'grid'; return; }

/* ---------- utilidades ---------- */
// Every random layout (bouquet, field, cake) derives from the SEED text in .env
const seedOf = s => { let h = 0x811c9dc5; for (const c of String(s)) { h ^= c.codePointAt(0); h = Math.imul(h, 0x01000193); } return h | 0; };
let seed = seedOf(APP_CONFIG.seed + ':bouquet');
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const add = (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]];
const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const mulS = (a, s) => [a[0]*s, a[1]*s, a[2]*s];
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]);
const norm = a => { const l = len(a) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };
const mix = (a, b, t) => a + (b - a) * t;
const mix3 = (a, b, t) => [mix(a[0],b[0],t), mix(a[1],b[1],t), mix(a[2],b[2],t)];
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// marco ortonormal: Y = dirección d
function frameY(d, twist = 0) {
  const Y = norm(d);
  const ref = Math.abs(Y[1]) < 0.95 ? [0, 1, 0] : [1, 0, 0];
  let X = norm(cross(ref, Y)); let Z = cross(X, Y);
  const c = Math.cos(twist), s = Math.sin(twist);
  const X2 = add(mulS(X, c), mulS(Z, s)), Z2 = add(mulS(X, -s), mulS(Z, c));
  return { X: X2, Y, Z: Z2 };
}
const applyF = (F, p, T, s = 1) => add(T, add(add(mulS(F.X, p[0]*s), mulS(F.Y, p[1]*s)), mulS(F.Z, p[2]*s)));

/* ---------- geometría procedural ---------- */
let G = { pos: [], nrm: [], col: [], ao: [], idx: [], cl: [], ce: [], tm: [] };
// contexto de animación: s = inicio (seg), d = duración, c = punto desde donde crece, along(u,v) = retraso extra
let A = null;
const anim = (cfg, fn) => { const prev = A; A = cfg; fn(); A = prev; };
function grid(nu, nv, f) {
  const base = G.pos.length / 3, W = nu + 1, P = [];
  for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) {
    const u = i / nu, v = j / nv, r = f(u, v), a = A || {};
    P.push(r.p); G.col.push(...r.c); G.ao.push(r.ao ?? 1);
    G.cl.push(...(r.cl || r.p)); G.ce.push(...(r.ce || a.c || r.p));
    G.tm.push((a.s ?? -10) + (a.along ? a.along(u, v) : 0), a.d ?? 0.001);
  }
  for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) {
    const du = sub(P[j*W + Math.min(i+1, nu)], P[j*W + Math.max(i-1, 0)]);
    const dv = sub(P[Math.min(j+1, nv)*W + i], P[Math.max(j-1, 0)*W + i]);
    let n = cross(du, dv); const l = len(n);
    n = l < 1e-10 ? [0, 1, 0] : mulS(n, 1 / l);
    G.pos.push(...P[j*W + i]); G.nrm.push(...n);
  }
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const a = base + j*W + i, b = a + 1, c = a + W, d = c + 1;
    G.idx.push(a, b, d, a, d, c);
  }
}

function tube(path, r0, r1, col, sides = 7) {
  const n = path.length - 1;
  grid(sides, n, (u, v) => {
    const k = Math.round(v * n);
    const T = norm(sub(path[Math.min(k+1, n)], path[Math.max(k-1, 0)]));
    const F = frameY(T);
    const a = u * Math.PI * 2, r = mix(r0, r1, v);
    return { p: add(path[k], add(mulS(F.X, Math.cos(a)*r), mulS(F.Z, Math.sin(a)*r))), c: col, ao: 0.8 };
  });
}
const bez = (a, b, c, t) => add(add(mulS(a, (1-t)*(1-t)), mulS(b, 2*(1-t)*t)), mulS(c, t*t));

// Lirio: 6 tépalos lanceolados (3 internos anchos + 3 externos), puntas que se curvan hacia atrás,
// manchas, estambres con anteras y pistilo
const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
function lily(T, dir, s, P, twist, t0) {
  const F = frameY(dir, twist);
  const nu = 12, nv = 26;
  for (let k = 0; k < 6; k++) {
    const inner = k % 2 === 0;
    const phi = k * Math.PI / 3 + twist * 0.3;
    const L = inner ? 1.0 : 0.94, Wd = inner ? 0.21 : 0.16;
    const a0 = inner ? 0.30 : 0.38, curl = inner ? 1.85 : 2.1;
    const r0 = inner ? 0.025 : 0.035, y0 = inner ? 0.0 : -0.015;
    const spine = (a0, curl, L) => { const ang = [], sp = [[0, 0]];
      for (let j = 0; j <= nv; j++) ang.push(a0 + curl * Math.pow(j / nv, 2.3));
      for (let j = 1; j <= nv; j++) { const a = ang[j-1], ds = L / nv;
        sp.push([sp[j-1][0] + Math.cos(a) * ds, sp[j-1][1] + Math.sin(a) * ds]); }
      return { ang, sp }; };
    const OPEN = spine(a0, curl, L), SHUT = spine(inner ? 0.02 : 0.06, 0.04, L * 0.5);
    const cph = Math.cos(phi), sph = Math.sin(phi);
    anim({ s: t0 + (inner ? 0.25 : 0), d: 2.8, c: T }, () => grid(nu, nv, (u, v) => {
      const j = Math.round(v * nv);
      const shape = (S, open) => { const a = S.ang[j], [sy, sz] = S.sp[j];
      const hw = (open ? 1 : 0.55) * Wd * Math.pow(Math.sin(Math.PI * Math.min(v, 0.995)), 0.72) * (0.35 + 0.65 * smooth(0, 0.3, v));
      const xr = (u - 0.5) * 2, x = xr * hw;
      // canal central + borde ondulado + cóncavo
      let off = -1.6 * x * x / (Wd * 4) - 0.022 * Math.exp(-xr * xr * 18) * smooth(0.05, 0.3, v) * (1 - v);
      off += 0.018 * Math.sin(v * 30 + k) * Math.pow(Math.abs(xr), 3) * smooth(0.3, 0.6, v);
      const lx = x, ly = sy - Math.sin(a) * off + y0, lz = sz + Math.cos(a) * off + r0;
      const px = lx * cph + lz * sph, pz = -lx * sph + lz * cph;
      return applyF(F, [px, ly, pz], T, s); };
      const xr = (u - 0.5) * 2;
      // color: garganta verdosa, centro de color, bordes claros, manchas
      const mid = Math.exp(-Math.pow(xr / (P.band), 2));
      let c = mix3(P.edge, P.center, mid * smooth(0.06, 0.28, v) * (1 - 0.35 * smooth(0.8, 1, v)));
      c = mix3(c, P.throat, 1 - smooth(0.0, 0.2, v));
      if (P.spots && v > 0.12 && v < 0.62 && Math.abs(xr) < 0.75 && hash(Math.round(u * nu) + k * 31, j) > 0.8)
        c = P.spots;
      return { p: shape(OPEN, true), cl: shape(SHUT, false), c, ao: 0.45 + 0.55 * smooth(0, 0.35, v) };
    }));
  }
  anim({ s: t0 + 1.4, d: 1.3, c: T }, () => {
  // estambres
  for (let k = 0; k < 6; k++) {
    const phi = k * Math.PI / 3 + Math.PI / 6 + twist * 0.3, cs = Math.sin(phi), cc = Math.cos(phi);
    const a = [0, 0.04, 0], b = [cs * 0.06, 0.42, cc * 0.06], e = [cs * 0.2, 0.68 + 0.04 * hash(k, 3), cc * 0.2];
    const path = []; for (let i = 0; i <= 8; i++) path.push(applyF(F, bez(a, b, e, i / 8), T, s));
    tube(path, 0.0065, 0.0055, P.filament, 5);
    const tang = [cc, 0, -cs];
    const an = []; for (let i = 0; i <= 4; i++) an.push(applyF(F, add(e, mulS(tang, (i / 4 - 0.5) * 0.09)), T, s));
    tube(an, 0.016, 0.016, P.anther, 6);
  }
  // pistilo
  const pa = [0, 0.03, 0], pb = [0, 0.5, 0.03], pe = [0, 0.82, 0.1];
  const pp = []; for (let i = 0; i <= 8; i++) pp.push(applyF(F, bez(pa, pb, pe, i / 8), T, s));
  tube(pp, 0.011, 0.009, P.filament, 6);
  sphere(applyF(F, pe, T, s), 0.02, P.stigma, 8, 6);
  });
  anim({ s: t0 - 0.35, d: 0.45, c: T }, () => sphere(applyF(F, [0, -0.02, 0], T, s), 0.05, [0.3, 0.5, 0.2], 8, 6));
}
// capullo cerrado con 3 aristas
function bud(T, dir, Ln, col, t0) {
  const F = frameY(dir, rnd() * 6.28);
  anim({ s: t0, d: 1.1, c: T }, () => grid(14, 18, (u, v) => {
    const th = u * Math.PI * 2;
    let r = 0.06 * Math.pow(Math.sin(Math.PI * Math.min(v, 0.995)), 0.6) * (0.75 + 0.5 * v);
    r *= 1 - 0.13 * Math.pow(Math.cos(1.5 * th), 2);
    const c = mix3([0.32, 0.55, 0.22], col, smooth(0.2, 0.85, v));
    return { p: applyF(F, [Math.cos(th) * r, v * Ln, Math.sin(th) * r], T), c, ao: 0.6 + 0.4 * v };
  }));
}
function leaf(base, dir, upHint, Ln, Wd, col) {
  const Y = norm(dir);
  let Z = norm(sub(upHint, mulS(Y, dot(upHint, Y))));
  const F = { X: cross(Y, Z), Y, Z };
  grid(6, 14, (u, v) => {
    let hw = Wd * Math.pow(Math.sin(Math.PI * Math.min(1, v * 1.02)), 0.85) * (0.6 + 0.4 * (1 - v));
    hw *= 1 + 0.07 * Math.sin(v * 46);
    const x = (u - 0.5) * 2 * hw;
    const z = -Math.abs(x) * 0.45 - 0.35 * v * v * Ln + 0.015 * Math.sin(v * 9 + u * 3);
    const vein = Math.exp(-Math.pow(x / (0.012 + 0.01 * (1 - v)), 2));
    const c = mulS(mix3(col, [0.42, 0.62, 0.28], vein * 0.5), 0.85 + 0.25 * v);
    return { p: applyF(F, [x, v * Ln, z], base), c, ao: 0.55 + 0.45 * v };
  });
}
function leafLocal(F, T, s, phi, Ln, Wd, open, col, y0) {
  const d = [Math.sin(open) * Math.sin(phi), -Math.cos(open) * 0.4 - 0.15, Math.sin(open) * Math.cos(phi)];
  const base = applyF(F, [Math.sin(phi) * 0.06, y0, Math.cos(phi) * 0.06], T, s);
  const wd = add(add(mulS(F.X, d[0]), mulS(F.Y, d[1])), mulS(F.Z, d[2]));
  leaf(base, wd, F.Y, Ln * s, Wd * s, col);
}

function sphere(c, r, col, nu = 6, nv = 4) {
  grid(nu, nv, (u, v) => {
    const th = u * Math.PI * 2, ph = v * Math.PI;
    return { p: [c[0] + r * Math.sin(ph) * Math.cos(th), c[1] + r * Math.cos(ph), c[2] + r * Math.sin(ph) * Math.sin(th)], c: col, ao: 1 };
  });
}

/* ---------- composición del ramo ---------- */
const STAR  = { edge: [0.98, 0.94, 0.95], center: [0.86, 0.1, 0.38], throat: [0.72, 0.84, 0.42], spots: [0.42, 0.02, 0.14], band: 0.55,
                filament: [0.62, 0.78, 0.45], anther: [0.5, 0.18, 0.06], stigma: [0.7, 0.25, 0.4] };
const WHITE = { edge: [0.99, 0.98, 0.95], center: [0.97, 0.96, 0.9], throat: [0.66, 0.84, 0.38], spots: null, band: 0.3,
                filament: [0.7, 0.85, 0.5], anther: [0.75, 0.38, 0.06], stigma: [0.62, 0.75, 0.4] };
const ORANGE = { edge: [1.0, 0.55, 0.08], center: [0.98, 0.38, 0.04], throat: [0.95, 0.72, 0.2], spots: [0.3, 0.06, 0.02], band: 0.6,
                filament: [0.95, 0.55, 0.15], anther: [0.4, 0.12, 0.04], stigma: [0.8, 0.4, 0.1] };
const PINKL = { edge: [0.99, 0.84, 0.88], center: [0.95, 0.48, 0.64], throat: [0.8, 0.86, 0.5], spots: [0.62, 0.12, 0.3], band: 0.45,
                filament: [0.7, 0.82, 0.5], anther: [0.55, 0.2, 0.08], stigma: [0.75, 0.4, 0.5] };
const PIV = [0, -0.95, 0];
const heads = [{ p: [0, 0.72, 0.08], s: 0.68, P: STAR }];
const ringT = [WHITE, ORANGE, STAR, WHITE, PINKL, ORANGE];
for (let i = 0; i < 6; i++) {
  const a = i * Math.PI / 3 + 0.2;
  heads.push({ p: [Math.cos(a) * 0.7, 0.32 + 0.06 * Math.sin(i * 2.1), Math.sin(a) * 0.7], s: 0.62, P: ringT[i] });
}
const TIE = [0, -1.05, 0];
const GROW = 2.2;
function stemTo(p, d, t0) {
  const b0 = sub(p, mulS(d, 0.02)), b1 = sub(p, mulS(d, 0.5));
  const bot = [p[0] * 0.12, -2.08, p[2] * 0.12], path = [];
  for (let i = 0; i <= 10; i++) path.push(bez(b0, b1, TIE, i / 10));
  for (let i = 1; i <= 6; i++) path.push(bez(TIE, mix3(TIE, bot, 0.5), bot, i / 6));
  anim({ s: t0, d: 0.08, along: (u, v) => (1 - v) * GROW }, () => tube(path, 0.024, 0.028, [0.2, 0.38, 0.13]));
  return path;
}
heads.forEach((h, hi) => {
  const d = norm(sub(h.p, PIV)); h.d = d;
  const st = 0.1 + hi * 0.11;
  lily(h.p, d, h.s, h.P, rnd() * 6.28, st + GROW - 0.1);
  const path = stemTo(h.p, d, st);
  // hojas angostas a lo largo del tallo
  for (const k of [3, 5]) {
    const q = path[k], tg = norm(sub(path[k - 1], path[k + 1]));
    const out = norm([q[0] + 0.001, 0, q[2] + 0.001]);
    anim({ s: st + (1 - k / 16) * GROW - 0.05, d: 0.9, c: q }, () =>
      leaf(q, norm(add(mulS(out, 0.9), mulS(tg, 0.5))), [0, 1, 0], 0.32 + rnd() * 0.08, 0.045, [0.17, 0.4, 0.14]));
  }
});
// capullos
const budC = [[0.96, 0.82, 0.88], [0.94, 0.94, 0.86], [1.0, 0.62, 0.3], [0.96, 0.82, 0.88]];
for (let i = 0; i < 4; i++) {
  const a = i * Math.PI / 2 + 0.75;
  const p = [Math.cos(a) * 0.4, 0.5 + 0.08 * (i % 2), Math.sin(a) * 0.4];
  const d = norm(add(norm(sub(p, PIV)), [0, 0.6, 0]));
  const st = 0.45 + i * 0.12;
  bud(p, d, 0.36, budC[i], st + GROW - 0.1);
  stemTo(p, d, st);
}
// follaje alrededor del borde
for (let i = 0; i < 14; i++) {
  const a = i * Math.PI / 7 + 0.1 + (rnd() - 0.5) * 0.25;
  const base = [Math.cos(a) * 0.66, -0.06 + rnd() * 0.08, Math.sin(a) * 0.66];
  const dir = [Math.cos(a), 0.1 + rnd() * 0.4, Math.sin(a)];
  anim({ s: 2.0 + i * 0.1, d: 1.2, c: base }, () =>
    leaf(base, dir, [0, 1, 0], 0.48 + rnd() * 0.14, 0.1, i % 2 ? [0.12, 0.32, 0.12] : [0.18, 0.4, 0.15]));
}
// paniculata
let tries = 0, placed = 0;
while (placed < 120 && tries < 6000) {
  tries++;
  const th = rnd() * Math.PI * 2, ph = Math.acos(mix(1, 0.15, rnd()));
  const r = 0.82 + rnd() * 0.12;
  const p = [r * Math.sin(ph) * Math.cos(th), -0.3 + r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th)];
  if (p[1] < -0.04) continue;
  let ok = true;
  for (const h of heads) if (len(sub(p, h.p)) < 0.38) { ok = false; break; }
  if (!ok) continue;
  placed++;
  const n = 3 + Math.floor(rnd() * 4);
  anim({ s: 4.8 + rnd() * 1.8, d: 0.6, c: p }, () => { for (let k = 0; k < n; k++)

<div id="juntos">
  <div class="lbl"><span id="nameA"></span> <span class="heart">♥</span> <span id="nameB"></span></div>
  <div class="t" id="juntosT"></div>
  <div class="msg" id="juntosMsg"></div>

<script>
(() => {
  const C = window.APP_CONFIG;
  document.getElementById('nameA').textContent = C.nameA;
  document.getElementById('nameB').textContent = C.nameB;
  const fill = (tpl, vars) => tpl.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
  // Relationship start, 00:00 local time
  const START = parseYMD(C.startDate);
  const BIRTH = parseYMD(C.birthdayDate);
  const el = document.getElementById('juntosT');
  const pad = n => String(n).padStart(2, '0');
  const plural = (n, s, p) => n + ' ' + (n === 1 ? s : p);

  const box = document.getElementById('juntos');
  const msg = document.getElementById('juntosMsg');
  // Preview with ?test=mes | anio | cumple — only when ENABLE_TEST=true in .env
  const test = C.enableTest ? new URLSearchParams(location.search).get('test') : null;

  function celebrate(now) {
    const isMonthiversary = now.getDate() === START.getDate() && now > START;
    const isAnniversary = isMonthiversary && now.getMonth() === START.getMonth();
    // Birthday takes priority over the other themes
    const isBirthday = now.getMonth() === BIRTH.getMonth() && now.getDate() === BIRTH.getDate();
    const bday = test === 'cumple' || (!test && isBirthday);
    box.classList.toggle('cumple', bday);
    let text = '';
    if (bday) {
      const t = fill(C.msgBirthday, { age: now.getFullYear() - BIRTH.getFullYear(), name: C.birthdayName });
      if (msg.textContent !== t) msg.textContent = t;
      box.classList.remove('fiesta');
      return;
    }
    if (test === 'anio' || (!test && isAnniversary)) {
      const n = now.getFullYear() - START.getFullYear();
      text = n > 1 ? fill(C.msgAnniversary, { n }) : C.msgAnniversaryFirst;
    } else if (test === 'mes' || (!test && isMonthiversary)) {
      text = C.msgMonthiversary;
    }
    box.classList.toggle('fiesta', !!text);
    if (msg.textContent !== text) msg.textContent = text;
  }

  function tick() {
    const now = new Date();
    celebrate(now);
    let y = now.getFullYear() - START.getFullYear();
    let m = now.getMonth() - START.getMonth();
    let anchor = new Date(START);
    anchor.setFullYear(START.getFullYear() + y, START.getMonth() + m);
    if (anchor > now) {
      m -= 1;
      anchor = new Date(START);
      anchor.setFullYear(START.getFullYear() + y, START.getMonth() + m);
    }
    if (m < 0) { y -= 1; m += 12; }
    let rest = Math.floor((now - anchor) / 1000);
    const d = Math.floor(rest / 86400); rest %= 86400;
    const h = Math.floor(rest / 3600); rest %= 3600;
    const min = Math.floor(rest / 60), s = rest % 60;
    el.textContent =
      plural(y, 'año', 'años') + ', ' + plural(m, 'mes', 'meses') + ', ' +
      plural(d, 'día', 'días') + ' · ' + pad(h) + 'h ' + pad(min) + 'm ' + pad(s) + 's';
  }
  tick();
  setInterval(tick, 1000);
})();
</script>

  const box = document.getElementById('juntos');
  const PETAL_CHARS = ['❀', '✿', '*', '°', "'", '`', ','];
  const PETAL_COLS = ['#f7c1d6', '#ffe3ee', '#f2a6c4', '#fff4f8', '#e9b3d9'];
  const r = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  let W = 0, H = 0, dpr = 1, FS = 14;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.width = Math.floor(innerWidth * dpr);
    H = cv.height = Math.floor(innerHeight * dpr);
    FS = Math.round(13 * dpr);
  }
  addEventListener('resize', resize); resize();

  const petals = [];
  // Birthday: colorful confetti instead of petals
  const CONFETTI_CHARS = ['*', '+', '•', '◆', '▪', '~', '✦', '°', '♥'];
  const CONFETTI_COLS = ['#ff5d8f', '#ffd36e', '#6ee7ff', '#9d7bff', '#7dff9b', '#ff9f43'];
  function spawn(y) {
    const confetti = box.classList.contains('cumple');
    petals.push({
      x: r(0, W), y: y ?? -FS,
      vy: (confetti ? r(45, 90) : r(18, 40)) * dpr, sway: r(10, 30) * dpr,
      ph: r(0, Math.PI * 2), rot: r(0, Math.PI * 2), vr: confetti ? r(-5, 5) : r(-1.2, 1.2),
      ch: pick(confetti ? CONFETTI_CHARS : PETAL_CHARS),
      col: pick(confetti ? CONFETTI_COLS : PETAL_COLS), a: r(0.65, 1),
    });
  }

  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const t = now / 1000;
    const party = box.classList.contains('fiesta');
    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    // Petals: a light drizzle normally, more on the monthiversary
    const rate = box.classList.contains('cumple') ? 9 : party ? 3.2 : 0.9; // per second
    acc += dt * rate;
    while (acc >= 1 && petals.length < 70) { spawn(); acc -= 1; }
    const baseFont = Math.round(FS * 1.1); let curFont = 0;
    for (let i = petals.length - 1; i >= 0; i--) {
      const p = petals[i];
      if (p.burst) {
        // cannon confetti: ballistic with air drag, settles into a gentle fall
        p.vy += 1100 * dpr * dt;
        const drag = Math.exp(-1.6 * dt); p.vx *= drag; p.vy *= drag;
        p.vy = Math.min(p.vy, 160 * dpr);
        p.x += p.vx * dt;
      }
      p.y += p.vy * dt; p.rot += p.vr * dt;
      const x = p.x + Math.sin(t * 0.9 + p.ph) * p.sway;
      if (p.y > H + FS) { petals.splice(i, 1); continue; }
      // fade near the bottom, only while falling
      ctx.globalAlpha = p.a * (p.vy > 0 ? Math.min(1, (H - p.y) / (H * 0.15)) : 1);
      ctx.fillStyle = p.col;
      ctx.save(); ctx.translate(x, p.y); ctx.rotate(p.rot);
      const fs = p.size || baseFont;
      if (fs !== curFont) { ctx.font = `${fs}px ui-monospace, Menlo, Consolas, monospace`; curFont = fs; }
      ctx.fillText(p.ch, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  // Confetti cannon: two blasts from the bottom corners toward the center
  function blast() {
    for (const side of [0, 1]) for (let i = 0; i < 200; i++) {
      const ang = r(55, 80) * Math.PI / 180, sp = r(900, 1700) * dpr;
      petals.push({
        burst: true, x: side ? W + r(0, 20) : -r(0, 20), y: H - r(0, 10),
        vx: (side ? -1 : 1) * Math.cos(ang) * sp, vy: -Math.sin(ang) * sp,
        sway: r(5, 20) * dpr, ph: r(0, 6.28), rot: r(0, 6.28), vr: r(-9, 9),
        ch: pick(CONFETTI_CHARS), col: pick(CONFETTI_COLS), a: r(0.75, 1),
        size: Math.round(FS * pick([1.9, 2.4, 2.9])), // big pieces for the cannon blast
      });
    }
  }
  // Confetti puff from the cake when it finishes building (birthday only)
  addEventListener('bloomdone', ev => {
    const confetti = ev.detail && ev.detail.bday;
    if (!confetti) return;
    for (let i = 0; i < 60; i++) {
      const ang = r(-170, -10) * Math.PI / 180, sp = r(250, 750) * dpr;
      petals.push({
        burst: true, x: W / 2 + r(-W * 0.06, W * 0.06), y: H * 0.38 + r(-H * 0.05, H * 0.05),
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        sway: r(10, 25) * dpr, ph: r(0, 6.28), rot: r(0, 6.28), vr: r(-3, 3),
        ch: pick(confetti ? CONFETTI_CHARS : PETAL_CHARS), col: pick(confetti ? CONFETTI_COLS : PETAL_COLS),
        a: r(0.7, 1), size: Math.round(FS * pick([1.2, 1.5, 1.8])),
      });
    }
  });
  let wasBday = false;
  const replayBtn = document.getElementById('replay');
  setInterval(() => {
    const bday = box.classList.contains('cumple');
    if (bday && !wasBday) blast();
    if (bday !== wasBday || !replayBtn.dataset.set) {
      replayBtn.textContent = bday ? '¡Otra vez! 🎉' : 'Volver a florecer';
      replayBtn.dataset.set = '1';
    }
    wasBday = bday;
  }, 200);
  document.getElementById('replay').addEventListener('click', () => {
    if (box.classList.contains('cumple')) blast();
  });
  // Start with a few petals already on screen
  for (let i = 0; i < 8; i++) spawn(r(0, H));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
